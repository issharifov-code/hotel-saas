version: "3.9"

# Lokal ishlab chiqish muhiti uchun. Production'da har bir xizmat alohida
# boshqariladigan infratuzilmada (masalan Kubernetes) joylashtiriladi.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel_saas
      POSTGRES_PASSWORD: hotel_saas_dev
      POSTGRES_DB: hotel_saas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
