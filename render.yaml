databases:
  - name: hotel-saas-db
    plan: basic-256mb
    databaseName: hotel_saas
    user: hotel_saas
    region: frankfurt

services:
  # Backend — NestJS API
  - name: hotel-saas-api
    type: web
    runtime: node
    plan: starter
    region: frankfurt
    # 🔴 XAVFSIZLIK AUDITI (2026-09-05, Medium — M1). Migratsiya va seed
    # ilgari `buildCommand` ichida ishlardi. Bu ikki muammoni bergan:
    #
    #  1. Sxema YANGI KOD JONLI BO'LISHIDAN OLDIN o'zgarardi. Build
    #     muvaffaqiyatli, lekin servis ko'tarilmasa — baza oldinga
    #     migratsiya qilingan, eski kod esa xizmat qilishda davom etardi,
    #     va Render'da oldingi deploy'ga qaytish kodni tiklaydi, sxemani
    #     emas.
    #  2. Build muhiti ishlab chiqarish baza kredensiallariga va
    #     platforma-admin sirlariga ega bo'lardi — ya'ni bog'liqlik
    #     daraxtidagi zararli `postinstall` skripti to'liq DB-egasi
    #     huquqi bilan ishga tushardi.
    #
    # `preDeployCommand` build'dan KEYIN, trafik yangi versiyaga
    # o'tishidan OLDIN ishlaydi va yiqilsa deploy toza to'xtaydi.
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter api build
    preDeployCommand: >-
      cd apps/api &&
      pnpm exec typeorm migration:run -d dist/database/data-source.js &&
      node dist/database/seed.js
    startCommand: node apps/api/dist/main.js
    # `GET /api/version` ataylab autentifikatsiyasiz va yengil (kommit
    # SHA + sxema timestamp). Render endi ko'tarilgan-u ishlamayotgan
    # instansiyani aniqlay oladi.
    healthCheckPath: /api/version
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: hotel-saas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hotel-saas-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: hotel-saas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hotel-saas-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: hotel-saas-db
          property: database
      # RLS ilova roli (EnableRowLevelSecurity migratsiyasi shu nom bilan yaratadi) —
      # o'zgartirmang, migratsiya kodi bilan mos kelishi shart.
      - key: DB_APP_USERNAME
        value: hotel_saas_app
      - key: DB_APP_PASSWORD
        generateValue: true
      - key: DB_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: '28800'
      # 🔴 XAVFSIZLIK AUDITI (2026-09-05, Low — L3). Bu yerda
      # `folioone.uz` turardi, sayt esa `usali.uz` da ishlaydi — ya'ni
      # repo'dagi blueprint deploy qilingan holatga MOS EMAS edi
      # (dashboard'da qo'lda o'zgartirilgan). Blueprint qayta
      # qo'llanganda bu jimgina ishlab chiqarish sozlamasini buzardi.
      #
      # ESLATMA: SPA `/api/*` ni Render rewrite orqali chaqiradi, ya'ni
      # so'rovlar same-origin va CORS ularga tegishli emas. Bu ro'yxat
      # to'g'ridan-to'g'ri API'ga murojaat qiladigan boshqa manbalar
      # uchun. Production'da bo'sh qoldirib bo'lmaydi — `main.ts`
      # ishga tushishni to'xtatadi.
      - key: CORS_ORIGIN
        value: https://usali.uz,https://www.usali.uz
      # Birinchi deploy'dan oldin Render dashboard'da qo'lda kiriting
      # (sync: false — qiymat repo'ga yozilmaydi).
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      # 🔔 OGOHLANTIRISH (2026-09-05). Ikkalasi ham berilsa, 5xx xato
      # yuz berganda Telegram'ga xabar ketadi. Berilmasa — xizmat
      # jimgina o'chib turadi va ilova o'zgarishsiz ishlaydi (ya'ni
      # bu sozlama MAJBURIY EMAS). Qanday olinishi:
      # docs/ogohlantirish.md.
      #
      # `sync: false` — qiymat repozitoriyga yozilmaydi, uni Render
      # dashboard'da qo'lda kiritasiz. Bot tokeni — sir: uni bilgan
      # har kim sizning nomingizdan xabar yubora oladi.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Frontend — Vite/React statik sayti
  - name: hotel-saas-web
    type: web
    runtime: static
    buildCommand: >-
      npm install -g pnpm@9.15.0 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter web build
    staticPublishPath: apps/web/dist
    routes:
      # /api/* so'rovlari backend'ga proksi qilinadi — frontend kodi (apiFetch)
      # o'zgarishsiz, nisbiy `/api/...` yo'llardan foydalanaveradi.
      # DIQQAT: agar backend servis nomi/manzili boshqacha bo'lsa, quyidagi
      # destination'ni Render dashboard'dagi haqiqiy backend URL bilan yangilang.
      - type: rewrite
        source: /api/*
        # DIQQAT: destination'dagi host nomi backend xizmati birinchi marta
        # yaratilganda Render tomonidan tasodifiy prefiks bilan yaratilishi
        # mumkin (masalan hotel-saas-api-ac6c.onrender.com). Har doim Render
        # dashboard'dagi haqiqiy backend URL bilan tekshiring/yangilang.
        # Wildcard qiymatini olib o'tish uchun Render'da $1 EMAS, * ishlatiladi.
        destination: https://hotel-saas-api-ac6c.onrender.com/api/*
      # Qolgan barcha yo'llar SPA (React Router) uchun index.html'ga qaytariladi.
      - type: rewrite
        source: /*
        destination: /index.html
